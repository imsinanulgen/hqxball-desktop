<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="top-rim-glare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="red-inner-glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6B63" />
      <stop offset="100%" stop-color="#FF3B30" />
    </radialGradient>

    <radialGradient id="blue-inner-glow" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#479CFF" />
      <stop offset="100%" stop-color="#007AFF" />
    </radialGradient>

    <filter id="ball-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#05080F" flood-opacity="0.6" />
    </filter>
  </defs>

  <g id="hqx-container">
    <rect id="squircle-bg" width="512" height="512" rx="115" ry="115" fill="#0F172A" />
    
    <rect id="squircle-specular-rim" x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="url(#top-rim-glare)" stroke-width="2" />
  </g>

  <g id="hqx-composition">
    
    <g id="player-discs">
      <g id="disc-left-red">
        <circle cx="166" cy="256" r="100" fill="url(#red-inner-glow)" />
        <circle cx="166" cy="256" r="99" fill="none" stroke="#FF8A82" stroke-width="2" opacity="0.8" />
      </g>

      <g id="disc-right-blue">
        <circle cx="346" cy="256" r="100" fill="url(#blue-inner-glow)" />
        <circle cx="346" cy="256" r="99" fill="none" stroke="#70B3FF" stroke-width="2" opacity="0.8" />
      </g>
    </g>

    <g id="focal-ball">
      <circle cx="256" cy="256" r="36" fill="#FFFFFF" filter="url(#ball-shadow)" />
    </g>
    
  </g>
</svg>
